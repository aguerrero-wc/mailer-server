# Desarrollo: docker compose --env-file .env -f docker-compose.yml up --build -d
services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: secure-mailer-service:dev-${VERSION:-latest}
    restart: unless-stopped
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mailer_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-securepass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_KEY_PRIVATE_ZONES: ${API_KEY_PRIVATE_ZONES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Soporte <no-reply@miempresa.com>}
    ports:
      - "${APP_PORT:-3001}:3000"
    volumes:
      - ./src:/usr/src/app/src:delegated
      - ./test:/usr/src/app/test:delegated
      - ./templates:/usr/src/app/templates:delegated
      - ./tsconfig.json:/usr/src/app/tsconfig.json:ro
      - ./tsconfig.build.json:/usr/src/app/tsconfig.build.json:ro
      - ./nest-cli.json:/usr/src/app/nest-cli.json:ro
      - /usr/src/app/node_modules
    networks:
      - secure_mail_network
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stdin_open: true
    tty: true

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mailer_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepass}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - secure_mail_network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - secure_mail_network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# Mantener estas claves y el nombre de proyecto para reutilizar los volúmenes actuales.
volumes:
  pg_data:
  redis_data:

networks:
  secure_mail_network:
    driver: bridge
