# La imagen oficial sustituye NGINX_TRUSTED_PROXY_CIDR al arrancar.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Confiar solo en la IP/subred del proxy configurado, no en una red de otro proyecto.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from ${NGINX_TRUSTED_PROXY_CIDR};

    # El esquema reenviado solo se acepta del proxy original de confianza.
    geo $realip_remote_addr $trusted_proxy {
        default 0;
        ${NGINX_TRUSTED_PROXY_CIDR} 1;
    }
    map "$trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
        default $scheme;
        "1:http" http;
        "1:https" https;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Resolver de Docker: actualizar la IP si Compose recrea el backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream nest_backend {
        zone nest_backend 64k;
        least_conn;
        server app-prod:3000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 10M;

        # Comprueba Nginx; app-prod tiene su propio healthcheck HTTP.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://nest_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # La auditoría de Nest lee el primer XFF: enviar solo la IP validada.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
